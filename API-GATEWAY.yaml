server:
  port: 9090

spring:
  application:
    name: API-GATEWAY

  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:9296}"

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:4200"
                allowed-methods:
                  - "GET"
                  - "POST"
                  - "PUT"
                  - "DELETE"
                  - "OPTIONS"
                  - "PATCH"
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600

          routes:
            - id: TECHNICAL-ANALYZER
              uri: lb://TECHNICAL-ANALYZER
              predicates:
                - Path=/ta/**

            - id: DELTA-EXCHANGE-API-BRIDGE
              uri: lb://DELTA-EXCHANGE-API-BRIDGE
              predicates:
                - Path=/delta/**

            - id: FYERS-API-BRIDGE
              uri: lb://FYERS-API-BRIDGE
              predicates:
                - Path=/fyers/**

            - id: LLM-AGENT
              uri: lb://LLM-AGENT
              predicates:
                - Path=/llm/**

management:
  tracing:
    sampling:
      probability: 1.0

  endpoints:
    web:
      exposure:
        include: '*'

  endpoint:
    gateway:
      access: unrestricted

  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
      propagation:
        type: "w3c, b3"

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
